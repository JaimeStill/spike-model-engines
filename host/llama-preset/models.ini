; Gemma 4 26B-A4B, MoE, Google's QAT Q4_0; its projector carries the vision encoder. The vision
; keys, ub, image-min-tokens and mtmd-batch-max-tokens, come from spike-ai-pipeline's preset
; (host/llama-preset/models.ini at 694f71b, the same section, served on gb10-2 at b12098). ub = 1120
; lets an image of up to 1120 tokens encode in one ubatch: llama-server caps an image's tokens at
; n_ubatch, so the default 512 cut every image to 512. image-min-tokens = 560 raises the smallest
; image's token budget: Gemma 4 sizes an image's tokens by its pixels, and a small image of dense
; text got too few to be read (spike-ai-pipeline's docinfer sample run, 2026-11-08).
; mtmd-batch-max-tokens = 512 (default 1024) keeps two 560-token images from sharing one encode
; batch, so the image encoder's buffer stays at the one-image size. Served on every host:
; spike-model-layout's hosts task chose this shared section over a gb10-2-only one. Set A's vision
; model.
; cache-ram = 0, cache-idle-slots = false and ctx-checkpoints = 2 cap the host prompt cache, as
; set-a's section does: at the default, cache-ram 8192 MiB a process, set A's 26B-A4B took gb10-1
; under its memory floor under vision load, its RSS growing 1217 -> 10397 MiB (spike-model-layout,
; docs/findings/footprint.md, sections G, I.4 and K). cache-idle-slots = false stops the idle-slot
; saves, which stalled decode on CUDA at b12098 (llama.cpp #30252); with no prompt cache nothing
; evicts a slot's context checkpoints, so ctx-checkpoints = 2 bounds them (spike-hosting-upgrades,
; docs/blockers.md, "Idle-slot saves stall decode on CUDA" and "Context checkpoints unbounded with
; no prompt cache"). The three together are gb10-1's measured Gemma configuration.
[google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0]
hf-repo = google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0
c = 32768
parallel = 4
ub = 1120
image-min-tokens = 560
mtmd-batch-max-tokens = 512
cache-ram = 0
cache-idle-slots = false
ctx-checkpoints = 2
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; The same 26B-A4B QAT file for role-split's split arm, the vision model of the GB10 that serves
