; The llama.cpp router's models preset, bind-mounted read-only into the llama container at
; /etc/llama-preset/models.ini (host/llama.sh), and read by native llama.cpp's llama-router unit
; through /opt/llama.cpp/preset/models.ini (host/llama-native.sh). Each section is a model the
; router lists; its keys are llama-server arguments without the leading dashes.
; docs/engines/llama.cpp/models.md gives the reason for each value.
;
; Every model names its Hugging Face repository and quantization in hf-repo, as hf pre-staged it
; into the store (/srv/models, Hugging Face's cache layout). The router picks the GGUF whose name
; carries the quantization and attaches the repository's projector (mmproj) beside it, so a
; section names no file path and no snapshot hash.

[*]
; Every model's layers on the GB10's GPU.
n-gpu-layers = all
; When a preset's hf-repo is already in the store, list the preset alone, not its cache entry too.
dedup-cache-models = true
; Serve /metrics, the Prometheus counters the benchmarks read for the server's own figures.
metrics = true
; Resolve every hf-repo from the store alone: no request to Hugging Face, so a load never
; downloads and a timed cold load reads only the disk. A model not in the store fails to load.
offline = true
; Log at trace level (4): at b11669 the default, info (3), leaves out the weight, KV, and compute
; buffer sizes each load logs, which the benchmarks read as the engine's own footprint.
verbosity = 4

; OpenAI's gpt-oss-120b in its native MXFP4. Card: https://huggingface.co/openai/gpt-oss-120b
; 4 slots of 8192 tokens each (c is split evenly across the slots).
; Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters": temperature 1.0,
; top_p 1.0; top-k = 0 and min-p = 0 turn off the server's two other truncations.
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 32768
parallel = 4
temp = 1
top-p = 1
top-k = 0
min-p = 0

; The same gpt-oss-120b file for the concurrency sweep: 16 slots of 8192 tokens each. A second
; name, since a loaded model keeps the arguments it started with; load one of the three at a time.
[gpt-oss-120b-MXFP4-16-slots]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 131072
parallel = 16
temp = 1
top-p = 1
top-k = 0
min-p = 0

; The same gpt-oss-120b file as set A's harness model, which the Framework serves between tasks
; (docs/engines/llama.cpp/setup.md, "Serve set A"): its trained context, 131072, in one KV pool
; its 4 slots share (kv-unified), so one long request may hold more than a quarter of it. The
; values are spike-ai-pipeline's set A (its host/llama-preset/models.ini, from spike-model-hosting's
; set A profile), whose [*] keys this section carries for itself: checkpoint-min-step = 4096 makes
; the 32-checkpoint budget's reach (32 x 4096) match c. A third name, since a loaded model keeps
; the arguments it started with; load one of the three gpt-oss sections at a time.
; cache-ram = 0 and cache-idle-slots = false turn off the host-side prompt cache and its idle-slot
; saves, which stalled multi-turn decode on gb10-1 (llama.cpp #30252; spike-hosting-upgrades,
; docs/screens/gb10-1/2026-11-05.md); set A did as well or better without it, and its 4.5 MiB
; checkpoints stay well inside the headroom.
[gpt-oss-120b-MXFP4-set-a]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 131072
parallel = 4
kv-unified = true
checkpoint-min-step = 4096
cache-ram = 0
cache-idle-slots = false
temp = 1
top-p = 1
top-k = 0
min-p = 0

; The Gemma 4 sections below share the anchors' 4 slots of 8192 tokens, except the 26B-A4B agent
; section, which gives its own, and the sampling Gemma 4's cards standardize for every use:
; temperature 1.0, top_p 0.95, top_k 64, which vLLM applies from the checkpoint's generation
; config; min-p = 0 turns off the server's other truncation, as vLLM has none. Each attaches the
; projector hf staged beside it, as vLLM loads the vision (and for E4B the audio) encoder with the
; model.

; Gemma 4 E4B, dense small, Q8_0; its projector carries the vision and audio encoders.
; Card: https://huggingface.co/google/gemma-4-E4B-it
[ggml-org/gemma-4-E4B-it-GGUF:Q8_0]
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q8_0
c = 32768
parallel = 4
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Gemma 4 E4B, Google's quantization-aware trained Q4_0: the quantization pair beside Q8_0.
[google/gemma-4-E4B-it-qat-q4_0-gguf:Q4_0]
hf-repo = google/gemma-4-E4B-it-qat-q4_0-gguf:Q4_0
c = 32768
parallel = 4
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Gemma 4 12B, dense mid, Google's QAT Q4_0.
[google/gemma-4-12B-it-qat-q4_0-gguf:Q4_0]
hf-repo = google/gemma-4-12B-it-qat-q4_0-gguf:Q4_0
c = 32768
parallel = 4
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Gemma 4 31B, dense large, Google's QAT Q4_0.
[google/gemma-4-31B-it-qat-q4_0-gguf:Q4_0]
hf-repo = google/gemma-4-31B-it-qat-q4_0-gguf:Q4_0
c = 32768
parallel = 4
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; Gemma 4 26B-A4B, MoE, Google's QAT Q4_0; its projector carries the vision encoder.
[google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0]
hf-repo = google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0
c = 32768
parallel = 4
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; The same Gemma 4 26B-A4B QAT file and projector as an agent model, which spike-hosting-upgrades'
; screen task measures serving agent and vision both, with gpt-oss-120b unloaded: 16 slots of
; 131072 tokens each, gpt-oss-120b's trained context, so every concurrent session holds the whole
; context set A's agent model reaches (c is split evenly across the slots: setting parallel leaves
; the KV cache split, not unified). Its 5 full-attention layers cost 20,480 bytes a token, 40 GiB
; at this c, so the section is about 59 GiB with its weights, estimated. Gemma 4's card sampling,
; as above. A second name, since a loaded model keeps the arguments it started with; load one of
; the two 26B-A4B sections at a time.
; CUDA only: at c = 2097152 each full-attention layer's K tensor is exactly 4 GiB, which aborts
; the load on Vulkan, and at 15 slots Vulkan crashes on the second request (llama.cpp #29221,
; whose fix #25584 is unmerged); spike-hosting-upgrades' screen, 2026-11-04.
; cache-ram = 0 and cache-idle-slots = false turn off the host-side prompt cache and its idle-slot
; saves, which stalled multi-turn decode on gb10-1 (llama.cpp #30252): 8-9 tok/s a request with
; it, about 21 without, on BFCL multi-turn at b12098. With no prompt cache nothing evicts a slot's
; context checkpoints (32 a slot by default, 200 MiB each on Gemma 4's sliding-window layers,
; about 100 GiB across 16 slots; free memory fell to 0.69 GiB), so ctx-checkpoints = 2 bounds them
; at about 6.4 GiB; spike-hosting-upgrades, docs/screens/gb10-1/2026-11-05.md.
[gemma-4-26B-A4B-QAT-Q4_0-agent]
hf-repo = google/gemma-4-26B-A4B-it-qat-q4_0-gguf:Q4_0
c = 2097152
parallel = 16
cache-ram = 0
cache-idle-slots = false
ctx-checkpoints = 2
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; IBM's granite-embedding-english-r2, BF16, served for /v1/embeddings only: the same weights as
; vLLM's row, from the BF16 GGUF converted from them; IBM publishes no GGUF of its own. The
; quantization BF16 picks granite-embedding-english-r2-bf16.gguf (the router matches it in the
; file name without regard to case), and the repository has no projector.
; Card: https://huggingface.co/ibm-granite/granite-embedding-english-r2
; A ModernBERT encoder; its GGUF declares CLS pooling (pooling_type 2), as the card's
; sentence-transformers config does, so no pooling key overrides it. 16 slots of 8192 tokens, its
; trained context, one a stream of the embedding cell's 16. An embedding model reads its whole
; input at once, not causally, so one input must fit one physical batch (ubatch-size, default 512,
; below the cell's 512 tokens plus the model's own): the batch is raised to a whole slot.
[mrutkows/granite-embedding-english-r2-GGUF:BF16]
hf-repo = mrutkows/granite-embedding-english-r2-GGUF:BF16
embeddings = true
c = 131072
parallel = 16
batch-size = 8192
ubatch-size = 8192
