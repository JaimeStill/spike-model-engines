; The llama.cpp router's models preset, bind-mounted read-only into the llama container at
; /etc/llama-preset/models.ini (host/llama.sh), and read by native llama.cpp's llama-router unit
; through /opt/llama.cpp/preset/models.ini (host/llama-native.sh). Each section is a model the
; router lists; its keys are llama-server arguments without the leading dashes.
; docs/engines/llama.cpp/models.md gives the reason for each value.
;
; Every model names its Hugging Face repository and quantization in hf-repo, as hf pre-staged it
; into the store (/srv/models, Hugging Face's cache layout). The router picks the GGUF whose name
; carries the quantization and attaches the repository's projector (mmproj) beside it, so a
; section names no file path and no snapshot hash.

[*]
; Every model's layers on the GB10's GPU.
n-gpu-layers = all
; When a preset's hf-repo is already in the store, list the preset alone, not its cache entry too.
dedup-cache-models = true
; Serve /metrics, the Prometheus counters the benchmarks read for the server's own figures.
metrics = true
; Resolve every hf-repo from the store alone: no request to Hugging Face, so a load never
; downloads and a timed cold load reads only the disk. A model not in the store fails to load.
offline = true
; Log at trace level (4): at b11669 the default, info (3), leaves out the weight, KV, and compute
; buffer sizes each load logs, which the benchmarks read as the engine's own footprint.
verbosity = 4

; OpenAI's gpt-oss-120b in its native MXFP4. Card: https://huggingface.co/openai/gpt-oss-120b
; 4 slots of 8192 tokens each (c is split evenly across the slots).
; Sampling from openai/gpt-oss's README, "Recommended Sampling Parameters": temperature 1.0,
; top_p 1.0; top-k = 0 and min-p = 0 turn off the server's two other truncations.
[ggml-org/gpt-oss-120b-GGUF:MXFP4]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 32768
parallel = 4
temp = 1
top-p = 1
top-k = 0
min-p = 0

; The same gpt-oss-120b file for the concurrency sweep: 16 slots of 8192 tokens each. A second
; name, since a loaded model keeps the arguments it started with; load one of the gpt-oss sections
; at a time.
[gpt-oss-120b-MXFP4-16-slots]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 131072
parallel = 16
temp = 1
top-p = 1
top-k = 0
min-p = 0

; The same gpt-oss-120b file as set A's harness model, which the Framework serves between tasks
; (docs/engines/llama.cpp/setup.md, "Serve set A"): its trained context, 131072, in one KV pool
; its 4 slots share (kv-unified), so one long request may hold more than a quarter of it. The
; values are spike-ai-pipeline's set A (its host/llama-preset/models.ini, from spike-model-hosting's
; set A profile), whose [*] keys this section carries for itself: checkpoint-min-step = 4096 makes
; the 32-checkpoint budget's reach (32 x 4096) match c. A third name, since a loaded model keeps
; the arguments it started with; load one of the gpt-oss sections at a time.
; cache-ram = 0 and cache-idle-slots = false turn off the host-side prompt cache and its idle-slot
; saves, which stalled an agent candidate's multi-turn decode on gb10-1 at b12098 (llama.cpp
; #30252); measured from fresh loads with and without them, set A did as well or better without
; (spike-hosting-upgrades, docs/screens/gb10-1/2026-11-05.md), and its 4.5 MiB checkpoints stay
; well inside the headroom.
[gpt-oss-120b-MXFP4-set-a]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 131072
parallel = 4
kv-unified = true
checkpoint-min-step = 4096
cache-ram = 0
cache-idle-slots = false
temp = 1
top-p = 1
top-k = 0
min-p = 0

; The same gpt-oss-120b file for role-split's split arm, a GB10 serving the agent alone: one KV
; pool of 1179648 tokens (9 x 131072) that its 16 slots share (kv-unified), with set-a's other
; keys and sampling. Nine 131072-token sessions is the count spike-model-layout's footprint finding
; computes for an agent-only GB10 (docs/findings/footprint.md, section I.4 and its worked placement
; I.7; section G: set A's figures under load; section K: the open items it leaves). The unified
; pool lets 16 shorter sessions share what 9 full ones would hold. cache-ram = 0 and
; cache-idle-slots = false, as set-a's: the prompt cache's idle-slot saves stalled decode on CUDA
; at b12098 (spike-hosting-upgrades, docs/blockers.md, "Idle-slot saves stall decode on CUDA",
; llama.cpp #30252, and "The prompt cache with a unified KV cache"). A fourth name, since a loaded
; model keeps the arguments it started with; load one of the gpt-oss sections at a time.
[gpt-oss-120b-MXFP4-agent-only]
hf-repo = ggml-org/gpt-oss-120b-GGUF:MXFP4
c = 1179648
parallel = 16
kv-unified = true
checkpoint-min-step = 4096
cache-ram = 0
cache-idle-slots = false
temp = 1
top-p = 1
top-k = 0
min-p = 0

; The Gemma 4 sections below share the anchors' 4 slots of 8192 tokens (the two 16-slot ones keep
; the slot size, at 16 slots), and the sampling Gemma 4's cards standardize for every use:
; temperature 1.0, top_p 0.95, top_k 64, which vLLM applies from the checkpoint's generation config;
; min-p = 0 turns off the server's other truncation, as vLLM has none. Each attaches the projector
; hf staged beside it, as vLLM loads the vision (and for E4B the audio) encoder with the model.

; Gemma 4 E4B, dense small, Q8_0; its projector carries the vision and audio encoders. Set A's
; audio model. Card: https://huggingface.co/google/gemma-4-E4B-it
; cache-ram = 0, cache-idle-slots = false and ctx-checkpoints = 2 cap the host prompt cache, as
; set-a's section does: at the default, cache-ram 8192 MiB a process, set A's 26B-A4B took gb10-1
; under its memory floor under vision load, its RSS growing 1217 -> 10397 MiB (spike-model-layout,
; docs/findings/footprint.md, sections G, I.4 and K). cache-idle-slots = false stops the idle-slot
; saves, which stalled decode on CUDA at b12098 (llama.cpp #30252); with no prompt cache nothing
; evicts a slot's context checkpoints, so ctx-checkpoints = 2 bounds them (spike-hosting-upgrades,
; docs/blockers.md, "Idle-slot saves stall decode on CUDA" and "Context checkpoints unbounded with
; no prompt cache"). The three together are gb10-1's measured Gemma configuration.
[ggml-org/gemma-4-E4B-it-GGUF:Q8_0]
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q8_0
c = 32768
parallel = 4
cache-ram = 0
cache-idle-slots = false
ctx-checkpoints = 2
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

; The same E4B file for role-split's split arm, the audio model of the GB10 that serves vision,
; audio and embedding: 16 slots of 8192 tokens each, set A's section's slot size, with its cap keys
; and their reasons (the section above; spike-hosting-upgrades, docs/blockers.md, the checkpoint
; and #30252 entries). Sized from spike-model-layout's footprint finding
; (docs/findings/footprint.md, section I.4: alone on a GB10 the model's headroom, 94.36 GiB, holds
; c far past 131072; section G: set A's figures under load; section K: the cap). A second name,
; since a loaded model keeps the arguments it started with; load one of the two E4B Q8_0 sections
; at a time.
[gemma-4-E4B-it-Q8_0-16-slots]
hf-repo = ggml-org/gemma-4-E4B-it-GGUF:Q8_0
c = 131072
parallel = 16
cache-ram = 0
cache-idle-slots = false
ctx-checkpoints = 2
temp = 1
top-p = 0.95
top-k = 64
min-p = 0

