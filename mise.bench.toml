# The load tool the spike measures with from the laptop, GuideLLM, and the runtimes it needs. It
# lives in its own environment, not mise.toml, so `mise run check` never installs it. Activate it
# with MISE_ENV=bench: `MISE_ENV=bench mise install`, then `MISE_ENV=bench mise exec -- guidellm`.
[tools]
# Held on 3.14: torch 2.14.1, which GuideLLM requires, publishes no wheels for Python 3.15
# (cp315) yet, so currency reports Python behind its latest, 3.15.2, until it does.
python = "3.14.10"
# mise's pipx backend installs GuideLLM through uv, with its vision and audio extras, which the
# vision cells' image requests and the audio-chat cells' audio requests need.
uv = "0.13.6"
"pipx:guidellm" = { version = "0.8.1", extras = ["vision", "audio"] }
