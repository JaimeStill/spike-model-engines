# Concurrency sweep: 1, 4, 16, and 32 streams for 60 s each, on either engine.
# See docs/bench.md#sweep
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: [1, 4, 16, 32]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  # See docs/bench.md#levels
  constraints:
    - kind: max_duration
      seconds: 60
