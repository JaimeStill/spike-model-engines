# Large shape cell A: the dense large model (gemma-4-31B), 1 stream sending 4 requests back to
# back, each 512 synthetic prompt tokens and exactly 256 output tokens: anchor cell A's load
# halved, since a dense 31B decodes slowly enough that 8 requests would cost the session more than
# they tell. Engine-neutral, like shape-a.yaml: the model, its tokenizer, and the JSON's path are
# given on the command line, and the target in GUIDELLM__SPEC__BACKEND__TARGET
# (docs/findings/bench-gb10-container.md, "Method"). Run from the repository root.
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # Gemma 4 reasons only when its chat template is asked to, so every request asks, as vLLM's
    # anchors A' and B' do: the 256 tokens are reasoning first, then the reply.
    extras:
      body:
        chat_template_kwargs:
          enable_thinking: true
  profile:
    kind: concurrent
    streams: 1
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_requests
      count: 4
