# Anchor cell B': Gemma 4 26B-A4B NVFP4 on vLLM, 4 streams sending 32 requests.
# See docs/bench.md#vllm-anchor-b
spec:
  backend:
    kind: openai_http
    model: nvidia/Gemma-4-26B-A4B-NVFP4
    request_format: /v1/chat/completions
    # See docs/bench.md#gemma-4s-reasoning
    extras:
      body:
        chat_template_kwargs:
          enable_thinking: true
  # See docs/bench.md#tokenizers
  tokenizer:
    kind: huggingface_auto
    model: nvidia/Gemma-4-26B-A4B-NVFP4
  profile:
    kind: concurrent
    streams: 4
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_requests
      count: 32
  outputs:
    - kind: json
      path: .state/vllm-anchor/b.json
