# Shape cell B: one Gemma 4 model at anchor cell B's load, on either engine.
# See docs/bench.md#shape-b
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
    # See docs/bench.md#gemma-4s-reasoning
    extras:
      body:
        chat_template_kwargs:
          enable_thinking: true
  profile:
    kind: concurrent
    streams: 4
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_requests
      count: 32
