# Vision cell B: gemma-4-26B-A4B, 4 streams of 720p image requests, on either engine.
# See docs/bench.md#vision-b
spec:
  backend:
    kind: openai_http
    request_format: /v1/chat/completions
  profile:
    kind: concurrent
    streams: 4
  # See docs/bench.md#vision-requests
  data:
    - kind: synthetic_text
      prompt_tokens: 200
    - kind: synthetic_image
      resolution: 720p
      format: jpeg
      output_tokens: 64
  constraints:
    - kind: max_requests
      count: 32
