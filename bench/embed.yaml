# Embedding cell: granite-embedding-english-r2 at 1, then 16 streams, on either engine.
# See docs/bench.md#embed
spec:
  backend:
    kind: openai_http
    request_format: /v1/embeddings
  profile:
    kind: concurrent
    streams: [1, 16]
  data:
    - kind: synthetic_text
      prompt_tokens: 512
  constraints:
    - kind: max_duration
      seconds: 30
