# Anchor cell A': Gemma 4 26B-A4B NVFP4 on vLLM, 1 stream sending 8 requests back to back, each
# 512 synthetic prompt tokens and exactly 256 output tokens. GuideLLM sends max_completion_tokens
# with ignore_eos whenever output_tokens is set, so every request generates its full 256. The
# target is the server's URL, which the architect sets in GUIDELLM__SPEC__BACKEND__TARGET so no
# address is committed. Run from the repository root (docs/findings/vllm-gb10-container.md).
spec:
  backend:
    kind: openai_http
    model: nvidia/Gemma-4-26B-A4B-NVFP4
    request_format: /v1/chat/completions
    # Gemma 4 reasons only when its chat template is asked to, so every request asks, as gpt-oss
    # reasons in anchor cell A: the 256 tokens are reasoning first, then the reply.
    extras:
      body:
        chat_template_kwargs:
          enable_thinking: true
  # The served checkpoint ships its own tokenizer, which cuts the prompt to its 512 tokens.
  tokenizer:
    kind: huggingface_auto
    model: nvidia/Gemma-4-26B-A4B-NVFP4
  profile:
    kind: concurrent
    streams: 1
  data:
    - kind: synthetic_text
      prompt_tokens: 512
      output_tokens: 256
  constraints:
    - kind: max_requests
      count: 8
  outputs:
    - kind: json
      path: .state/vllm-anchor/a.json
